      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('yamaha_thamrin_theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased transition-colors duration-200 selection:bg-blue-700 selection:text-white dark:bg-[#080E1A] dark:text-slate-100">
